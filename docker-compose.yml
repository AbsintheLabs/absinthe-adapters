# docker-compose.yml
version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: absinthe-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  absinthe-adapters:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absinthe-adapters
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      # Config path from .env
      - CONFIG_PATH=adapters/morphov1vaults/tests/config/morphov1vaults.absinthe.json
      # Pass through any other env vars
      - LOG_LEVEL=debug
      - COINGECKO_API_KEY=CG-m1UbfSdGRpxEmpXrABtua63w
    volumes:
      # Output directories
      - ./_runs:/app/_runs
      - ./_sqdstate:/app/_sqdstate
      - ./logs:/app/logs
      # Mount adapters as read-only for config access
      - ./adapters:/app/adapters:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
