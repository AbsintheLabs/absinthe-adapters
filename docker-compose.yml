version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: yada-redis
    ports:
      - '6379:6379'
    networks:
      - yada-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  yada:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: yada
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Output directories
      # - ./_runs:/app/_runs
      # - ./_sqdstate:/app/_sqdstate
      # - ./logs:/app/logs
      # Mount adapters as read-only for config access
      # - ./adapters:/app/adapters:ro
    networks:
      - yada-network
    restart: unless-stopped

networks:
  yada-network:
    driver: bridge
