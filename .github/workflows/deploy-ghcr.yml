name: Build & Push Docker Image to GHCR

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [develop-next]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine SemVer
        id: semver
        run: |
          VERSION="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -z "$VERSION" ]; then
            echo "No exact semver tag on this commit, skipping versioned push."
          else
            echo "SemVer detected: $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="ghcr.io/absinthelabs/absinthe-adapters"
          VERSION=${VERSION:-latest}
          GIT_COMMIT_SHA_LONG=$(git rev-parse HEAD)

          echo "🚀 Building Docker image for ${IMAGE_NAME}:${VERSION}"
          echo "Commit SHA: ${GIT_COMMIT_SHA_LONG}"

          docker buildx build \
            --build-arg GIT_COMMIT_SHA_LONG=${GIT_COMMIT_SHA_LONG} \
            --file src/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag ${IMAGE_NAME}:latest \
            --tag ${IMAGE_NAME}:${VERSION} \
            --push .

      # Optional Slack notification
